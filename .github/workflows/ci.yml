name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# The job only reads the repository; GITHUB_TOKEN gets no write scope.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: asset_sync
          POSTGRES_USER: asset_sync
          POSTGRES_PASSWORD: asset_sync
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U asset_sync -d asset_sync"
          --health-interval 5s --health-timeout 5s --health-retries 10

    # Actions are pinned to full commit SHAs, because a tag can be force-pushed; Dependabot updates
    # the SHA together with the version comment.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Run checks
        run: ./gradlew clean check

      - name: Build boot jar
        run: ./gradlew bootJar

      - name: Boot smoke (real java -jar — catches startup regressions the MOCK-env tests miss)
        run: |
          JAR=$(ls build/libs/asset-sync-service-*.jar | grep -v plain | head -1)
          SPRING_PROFILES_ACTIVE=local SERVER_PORT=8080 \
          ASSET_SYNC_DB_HOST=localhost ASSET_SYNC_DB_PORT=5432 ASSET_SYNC_DB_NAME=asset_sync \
          ASSET_SYNC_DB_USER=asset_sync ASSET_SYNC_DB_PASSWORD=asset_sync \
          java -jar "$JAR" > boot-smoke.log 2>&1 &
          JPID=$!
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health >/dev/null 2>&1; then
              echo "Boot smoke OK: application became healthy under a real servlet container."
              kill "$JPID" 2>/dev/null || true
              exit 0
            fi
            if ! kill -0 "$JPID" 2>/dev/null; then
              echo "Boot smoke FAILED: application exited during startup."
              tail -60 boot-smoke.log
              exit 1
            fi
            sleep 2
          done
          echo "Boot smoke FAILED: application did not become healthy in time."
          tail -60 boot-smoke.log
          kill -9 "$JPID" 2>/dev/null || true
          exit 1

      - name: Build Docker image
        run: docker build --build-arg JAR_FILE=build/libs/*.jar -t asset-sync-service:ci .

      # Fails on HIGH and CRITICAL vulnerabilities that have a fix, in the OS packages and in the
      # libraries inside the jar; a justified exception goes to .trivyignore. Trivy runs from its
      # image pinned by digest, not from aquasecurity/trivy-action: the tags of that action and of
      # setup-trivy were force-pushed to credential-stealing code in March 2026, and a digest cannot
      # be moved. The vulnerability and Java databases are downloaded fresh on every run; the
      # timeout leaves room for that, because Trivy's default of 5 minutes includes the download.
      - name: Scan Docker image
        run: >-
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          -v "$PWD:/workspace:ro" -w /workspace
          aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
          image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress
          --timeout 15m asset-sync-service:ci

      - name: Validate Docker Compose config
        run: docker compose config

      - name: Verify generated jOOQ sources are not tracked
        run: test -z "$(git ls-files build/generated/sources/jooq/main/kotlin)"
