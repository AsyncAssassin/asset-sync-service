# Dependabot version updates, run as pull requests under the CI workflow. Major bumps of Spring
# Boot and springdoc are ignored on purpose: they are a separate migration, not a routine update.
# Open-source support for Spring Boot 3.5 ended with 3.5.16, so the BOM property pins in
# build.gradle.kts (Jackson, Tomcat, pgjdbc, Log4j, commons-lang3) are not updated here and are
# maintained by hand. The docker entry moves the pinned base image of the Dockerfile.
version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      spring:
        patterns:
          - "org.springframework.boot*"
          - "io.spring.dependency-management"
      kotlin:
        # The Kotlin Gradle plugins are declared as kotlin("jvm") and kotlin("plugin.spring"), which
        # Dependabot names "jvm" and "plugin.spring"; they must move together.
        patterns:
          - "jvm"
          - "plugin.spring"
          - "org.jetbrains.kotlin*"
      jackson:
        patterns:
          - "com.fasterxml.jackson*"
    ignore:
      - dependency-name: "org.springframework.boot"
        update-types: ["version-update:semver-major"]
      - dependency-name: "io.spring.dependency-management"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.springdoc:*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
