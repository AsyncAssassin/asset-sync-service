# Loopback only: `local` has no authentication, so a run on a host must not be reachable from
# other machines. SERVER_ADDRESS=0.0.0.0 would open it; never do that with this profile. The Docker
# image sets it, because a container is reached through the port it publishes.
server:
  address: ${SERVER_ADDRESS:127.0.0.1}

spring:
  datasource:
    url: jdbc:postgresql://${ASSET_SYNC_DB_HOST:localhost}:${ASSET_SYNC_DB_PORT:5432}/${ASSET_SYNC_DB_NAME:asset_sync}
    username: ${ASSET_SYNC_DB_USER:asset_sync}
    password: ${ASSET_SYNC_DB_PASSWORD:asset_sync}
    hikari:
      maximum-pool-size: ${ASSET_SYNC_DB_MAX_POOL_SIZE:10}
      minimum-idle: ${ASSET_SYNC_DB_MIN_IDLE:1}
      pool-name: asset-sync-hikari
  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.yaml
  autoconfigure:
    # The local security chain is permitAll and defines no UserDetailsService, so skip Boot's
    # in-memory user and its "Using generated security password" startup warning.
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

management:
  endpoint:
    health:
      # Everything is open locally, so show component details to everyone.
      show-details: always
