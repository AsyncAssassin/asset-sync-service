spring:
  datasource:
    # Env-only, no defaults: the app fails fast at startup if a secret is missing.
    url: ${ASSET_SYNC_DB_URL}
    username: ${ASSET_SYNC_DB_USER}
    password: ${ASSET_SYNC_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${ASSET_SYNC_DB_MAX_POOL_SIZE:10}
      minimum-idle: ${ASSET_SYNC_DB_MIN_IDLE:2}
      pool-name: asset-sync-hikari
  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.yaml
    # Liquibase gets a dedicated bare connection so the app pool's statement_timeout /
    # lock_timeout (base application.yml connection-init-sql) never aborts a long migration.
    url: ${ASSET_SYNC_DB_URL}
    user: ${ASSET_SYNC_DB_USER}
    password: ${ASSET_SYNC_DB_PASSWORD}

asset-sync:
  provider:
    # Required when asset-sync.provider.type is http (the default): the HTTP RestClient bean fails
    # fast on a blank value. Unused under type=alchemy, which needs ASSET_SYNC_PROVIDER_ALCHEMY_API_KEY
    # instead; the type selector and timeouts come from application.yml.
    base-url: ${ASSET_SYNC_PROVIDER_BASE_URL:}
