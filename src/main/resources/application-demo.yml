# Loopback only: the demo users have public passwords. SERVER_ADDRESS=0.0.0.0 opens a remote demo,
# on a trusted network only. The Docker image sets it, because a container is reached through the
# port it publishes.
server:
  address: ${SERVER_ADDRESS:127.0.0.1}

spring:
  datasource:
    url: jdbc:postgresql://${ASSET_SYNC_DB_HOST:localhost}:${ASSET_SYNC_DB_PORT:5432}/${ASSET_SYNC_DB_NAME:asset_sync}
    username: ${ASSET_SYNC_DB_USER:asset_sync}
    password: ${ASSET_SYNC_DB_PASSWORD:asset_sync}
    hikari:
      maximum-pool-size: ${ASSET_SYNC_DB_MAX_POOL_SIZE:10}
      minimum-idle: ${ASSET_SYNC_DB_MIN_IDLE:1}
      pool-name: asset-sync-hikari
  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.yaml

asset-sync:
  provider:
    # The demo provider is the HTTP bridge (type http, the default) calling the bundled in-process
    # simulator over real HTTP (self-call on the server port). Resolving `server.port` rather than
    # the SERVER_PORT variable follows the configured port whichever way it is set (the variable,
    # `--server.port`, an IDE run configuration); the self-call needs a fixed port (not 0) and no
    # servlet context path. Schedulers stay ON so demo shows the outbox publisher and recovery live.
    base-url: http://localhost:${server.port:8080}/simulator
