spring:
  datasource:
    url: jdbc:postgresql://${ASSET_SYNC_DB_HOST:localhost}:${ASSET_SYNC_DB_PORT:5432}/${ASSET_SYNC_DB_NAME:asset_sync}
    username: ${ASSET_SYNC_DB_USER:asset_sync}
    password: ${ASSET_SYNC_DB_PASSWORD:asset_sync}
    hikari:
      maximum-pool-size: ${ASSET_SYNC_DB_MAX_POOL_SIZE:10}
      minimum-idle: ${ASSET_SYNC_DB_MIN_IDLE:1}
      pool-name: asset-sync-hikari
  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.yaml

asset-sync:
  provider:
    # The demo provider is the HTTP bridge (type http, the default) calling the bundled in-process
    # simulator over real HTTP (self-call on the fixed server port). Schedulers stay ON so demo
    # shows the outbox publisher and recovery live.
    base-url: http://localhost:${SERVER_PORT:8080}/simulator
