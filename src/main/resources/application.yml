spring:
  application:
    name: asset-sync-service
  jooq:
    sql-dialect: postgres
  datasource:
    hikari:
      connection-init-sql: "SET statement_timeout TO '30s'; SET lock_timeout TO '5s'"
  liquibase:
    enabled: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

logging:
  pattern:
    # Surfaces the per-request correlation id (set by RequestIdFilter) on every log line.
    level: "%5p [req=%X{requestId:-}]"

management:
  endpoint:
    health:
      probes:
        enabled: true
      # Component details (db, chain provider) for authenticated callers only; anonymous probes
      # keep seeing the aggregate status. `local` overrides this to `always`.
      show-details: when-authorized
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  # Deliberately enabled in every profile: non-local profiles put both endpoints behind HTTP Basic.
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

asset-sync:
  sync:
    provider-timeout: ${ASSET_SYNC_SYNC_PROVIDER_TIMEOUT:10s}
    provider-max-threads: ${ASSET_SYNC_SYNC_PROVIDER_MAX_THREADS:4}
    account-sync-batch-size: ${ASSET_SYNC_ACCOUNT_SYNC_BATCH_SIZE:100}
    max-account-sync-addresses: ${ASSET_SYNC_MAX_ACCOUNT_SYNC_ADDRESSES:1000}
    stale-run-timeout: ${ASSET_SYNC_STALE_RUN_TIMEOUT:30m}
    pagination:
      page-size: ${ASSET_SYNC_PAGINATION_PAGE_SIZE:100}
      max-pages-per-address-run: ${ASSET_SYNC_PAGINATION_MAX_PAGES_PER_ADDRESS_RUN:50}
      max-events-per-address-run: ${ASSET_SYNC_PAGINATION_MAX_EVENTS_PER_ADDRESS_RUN:5000}
      max-pages-per-account-run: ${ASSET_SYNC_PAGINATION_MAX_PAGES_PER_ACCOUNT_RUN:200}
      max-events-per-account-run: ${ASSET_SYNC_PAGINATION_MAX_EVENTS_PER_ACCOUNT_RUN:20000}
      max-run-duration: ${ASSET_SYNC_PAGINATION_MAX_RUN_DURATION:2m}
      cursor-lease-duration: ${ASSET_SYNC_PAGINATION_CURSOR_LEASE_DURATION:2m}
      cursor-heartbeat-interval: ${ASSET_SYNC_PAGINATION_CURSOR_HEARTBEAT_INTERVAL:30s}
      cursor-lease-retry-delay: ${ASSET_SYNC_PAGINATION_CURSOR_LEASE_RETRY_DELAY:5s}
      continuation-requeue-delay: ${ASSET_SYNC_PAGINATION_CONTINUATION_REQUEUE_DELAY:1s}
      max-continuations-per-run: ${ASSET_SYNC_PAGINATION_MAX_CONTINUATIONS_PER_RUN:1000}
      max-cursor-length: ${ASSET_SYNC_PAGINATION_MAX_CURSOR_LENGTH:4096}
      max-checkpoint-json-length: ${ASSET_SYNC_PAGINATION_MAX_CHECKPOINT_JSON_LENGTH:16384}
      max-provider-page-bytes: ${ASSET_SYNC_PAGINATION_MAX_PROVIDER_PAGE_BYTES:1048576}
    recovery:
      enabled: ${ASSET_SYNC_RECOVERY_ENABLED:true}
      batch-size: ${ASSET_SYNC_RECOVERY_BATCH_SIZE:100}
      fixed-delay: ${ASSET_SYNC_RECOVERY_FIXED_DELAY:5m}
      initial-delay: ${ASSET_SYNC_RECOVERY_INITIAL_DELAY:5m}
    worker:
      enabled: ${ASSET_SYNC_WORKER_ENABLED:true}
      fixed-delay: ${ASSET_SYNC_WORKER_FIXED_DELAY:5s}
      initial-delay: ${ASSET_SYNC_WORKER_INITIAL_DELAY:10s}
      claim-batch-size: ${ASSET_SYNC_WORKER_CLAIM_BATCH_SIZE:10}
      max-concurrency: ${ASSET_SYNC_WORKER_MAX_CONCURRENCY:4}
      lease-duration: ${ASSET_SYNC_WORKER_LEASE_DURATION:60s}
      heartbeat-interval: ${ASSET_SYNC_WORKER_HEARTBEAT_INTERVAL:20s}
      max-attempts: ${ASSET_SYNC_WORKER_MAX_ATTEMPTS:5}
      retry-backoff-base-delay: ${ASSET_SYNC_WORKER_RETRY_BACKOFF_BASE_DELAY:30s}
      retry-backoff-max-delay: ${ASSET_SYNC_WORKER_RETRY_BACKOFF_MAX_DELAY:15m}
      max-in-flight-runs: ${ASSET_SYNC_WORKER_MAX_IN_FLIGHT_RUNS:1000}
      max-error-length: ${ASSET_SYNC_WORKER_MAX_ERROR_LENGTH:1024}
  outbox:
    batch-size: ${ASSET_SYNC_OUTBOX_BATCH_SIZE:50}
    retry-backoff-base-delay: ${ASSET_SYNC_OUTBOX_RETRY_BACKOFF_BASE_DELAY:30s}
    retry-backoff-max-delay: ${ASSET_SYNC_OUTBOX_RETRY_BACKOFF_MAX_DELAY:15m}
    processing-lease: ${ASSET_SYNC_OUTBOX_PROCESSING_LEASE:5m}
    max-attempts: ${ASSET_SYNC_OUTBOX_MAX_ATTEMPTS:10}
    max-error-length: ${ASSET_SYNC_OUTBOX_MAX_ERROR_LENGTH:1024}
    retention:
      enabled: ${ASSET_SYNC_OUTBOX_RETENTION_ENABLED:false}
      published-retention: ${ASSET_SYNC_OUTBOX_PUBLISHED_RETENTION:7d}
      batch-size: ${ASSET_SYNC_OUTBOX_RETENTION_BATCH_SIZE:1000}
      fixed-delay: ${ASSET_SYNC_OUTBOX_RETENTION_FIXED_DELAY:1h}
      initial-delay: ${ASSET_SYNC_OUTBOX_RETENTION_INITIAL_DELAY:5m}
    scheduler:
      enabled: ${ASSET_SYNC_OUTBOX_SCHEDULER_ENABLED:true}
      fixed-delay: ${ASSET_SYNC_OUTBOX_SCHEDULER_FIXED_DELAY:5s}
      initial-delay: ${ASSET_SYNC_OUTBOX_SCHEDULER_INITIAL_DELAY:10s}
