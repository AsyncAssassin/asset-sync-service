databaseChangeLog:
  - changeSet:
      id: 015-add-asset-configs
      author: AsyncAssassin
      changes:
        - sql:
            dbms: postgresql
            splitStatements: true
            stripComments: true
            sql: |
              CREATE TABLE asset_configs (
                  chain_id text NOT NULL,
                  asset text NOT NULL,
                  token_standard text NOT NULL,
                  contract_address text NOT NULL,
                  decimals integer NOT NULL,
                  display_name text,
                  enabled boolean NOT NULL,
                  created_at timestamptz NOT NULL,
                  updated_at timestamptz NOT NULL,
                  CONSTRAINT pk_asset_configs PRIMARY KEY (chain_id, asset),
                  CONSTRAINT fk_asset_configs_chain_id
                      FOREIGN KEY (chain_id) REFERENCES chain_configs (chain_id),
                  CONSTRAINT uq_asset_configs_chain_id_contract_address
                      UNIQUE (chain_id, contract_address),
                  CONSTRAINT ck_asset_configs_chain_id_length
                      CHECK (char_length(chain_id) <= 64),
                  CONSTRAINT ck_asset_configs_asset_length
                      CHECK (char_length(asset) <= 32),
                  CONSTRAINT ck_asset_configs_asset_upper
                      CHECK (asset = upper(asset)),
                  CONSTRAINT ck_asset_configs_token_standard
                      CHECK (token_standard IN ('ERC20')),
                  CONSTRAINT ck_asset_configs_contract_address_lower
                      CHECK (contract_address = lower(contract_address)),
                  CONSTRAINT ck_asset_configs_contract_address_format
                      CHECK (contract_address ~ '^0x[0-9a-f]{40}$'),
                  CONSTRAINT ck_asset_configs_decimals_range
                      CHECK (decimals BETWEEN 0 AND 18),
                  CONSTRAINT ck_asset_configs_display_name_length
                      CHECK (display_name IS NULL OR char_length(display_name) <= 128)
              );

              INSERT INTO chain_configs (chain_id, display_name, required_confirmations, enabled, created_at, updated_at)
              VALUES
                  ('eth-sepolia', 'Ethereum Sepolia', 1, true, now(), now()),
                  ('eth-mainnet', 'Ethereum Mainnet', 12, false, now(), now())
              ON CONFLICT (chain_id) DO UPDATE
              SET display_name = EXCLUDED.display_name,
                  required_confirmations = EXCLUDED.required_confirmations,
                  enabled = EXCLUDED.enabled,
                  updated_at = now();

              INSERT INTO asset_configs (chain_id, asset, token_standard, contract_address, decimals, display_name, enabled, created_at, updated_at)
              VALUES
                  ('local-evm', 'USDC', 'ERC20', '0x000000000000000000000000000000000000f001', 18, 'USD Coin (local fake)', true, now(), now()),
                  ('eth-sepolia', 'USDC', 'ERC20', '0x1c7d4b196cb0c7b01d743fbc6116a902379c7238', 6, 'USD Coin', true, now(), now()),
                  ('eth-mainnet', 'USDC', 'ERC20', '0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48', 6, 'USD Coin', false, now(), now())
              ON CONFLICT (chain_id, asset) DO UPDATE
              SET token_standard = EXCLUDED.token_standard,
                  contract_address = EXCLUDED.contract_address,
                  decimals = EXCLUDED.decimals,
                  display_name = EXCLUDED.display_name,
                  enabled = EXCLUDED.enabled,
                  updated_at = now();
